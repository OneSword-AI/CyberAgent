[project]
name = "cyberagent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "tuxnode", email = "tuxnode@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    "docker>=7.2.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
]

[project.scripts]
cyberagent = "cyberagent:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]
